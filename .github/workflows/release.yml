name: Release

on:
  push:
    tags: ['v*'] # 예: v0.1.0, v0.2.0-beta.1

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
    env:
      TAG: ${{ github.ref_name }}
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0 # main 이력과 비교하기 위해 전체 이력 필요

      - name: Check tag is on main
        run: |
          if ! git merge-base --is-ancestor "$GITHUB_SHA" origin/main; then
            echo "::error::태그 '$TAG'가 main 브랜치에 없는 커밋을 가리킵니다."
            exit 1
          fi

      - name: Read version from tag
        id: version
        run: |
          version="${TAG#v}"
          # SemVer 형식만 허용 (1.2.3, 1.2.3-beta.1)
          if [[ ! "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$ ]]; then
            echo "::error::태그 '$TAG'가 v<SemVer> 형식이 아닙니다."
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"

  test:
    needs: verify
    uses: ./.github/workflows/test.yml

  release:
    needs: [verify, test]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      TAG: ${{ github.ref_name }}
      VERSION: ${{ needs.verify.outputs.version }}
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 10.0.x

      - name: Pack
        run: >
          dotnet pack src/HangulSharp/HangulSharp.csproj
          --configuration Release
          --output artifacts
          -p:Version=$VERSION
          -p:ContinuousIntegrationBuild=true

      - name: Push to NuGet
        env:
          NUGET_API_KEY: ${{ secrets.NUGET_API_KEY }}
        run: >
          dotnet nuget push "artifacts/*.nupkg"
          --api-key "$NUGET_API_KEY"
          --source https://api.nuget.org/v3/index.json
          --skip-duplicate

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # 버전에 '-'가 있으면(1.0.0-beta.1 등) 프리릴리즈로 표시
          prerelease=""
          if [[ "$VERSION" == *-* ]]; then
            prerelease="--prerelease"
          fi

          gh release create "$TAG" artifacts/*.nupkg \
            --repo "$GITHUB_REPOSITORY" \
            --title "$TAG" \
            --generate-notes \
            --verify-tag \
            $prerelease
