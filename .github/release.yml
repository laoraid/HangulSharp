# 자동 생성 릴리즈 노트의 분류 규칙 (PR 라벨 기준)
changelog:
  exclude:
    labels:
      - skip-changelog
  categories:
    - title: 새 기능
      labels:
        - enhancement
    - title: 버그 수정
      labels:
        - bug
    - title: 문서
      labels:
        - documentation
    - title: 기타
      labels:
        - '*'
